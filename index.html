<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ma carte</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; background: #eae6df; }
  body.night { background: #14161a; }
  #map { position: absolute; inset: 0; background: transparent; }
  .leaflet-container { font-family: -apple-system, system-ui, sans-serif; background: #eae6df; }
  body.night .leaflet-container { background: #14161a; }
  .leaflet-control-attribution { font-size: 10px; opacity: .75; }
  body.night .leaflet-control-attribution { background: rgba(20,22,26,.7); color: #9aa; }
  body.night .leaflet-control-attribution a { color: #9bd; }
  .leaflet-control-zoom { display: none; }
  .leaflet-tile-pane { transition: filter .6s ease; filter: saturate(1.15) contrast(1.02) brightness(1.02); }
  body.night .leaflet-tile-pane { filter: invert(1) hue-rotate(200deg) saturate(.55) brightness(.92) contrast(.95); }

  .me { position: relative; width: 22px; height: 22px; }
  .me .pulse { position: absolute; inset: 0; border-radius: 50%; background: rgba(26,115,232,.35); animation: pulse 2s ease-out infinite; }
  .me .dot { position: absolute; inset: 3px; border-radius: 50%; background: #1a73e8; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.4); box-sizing: border-box; inset: 2px; }
  @keyframes pulse { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(2.6); opacity: 0; } }

  #msg { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%);
    background: rgba(255,255,255,.95); color: #222; padding: 10px 16px; border-radius: 999px; font: 14px -apple-system, system-ui, sans-serif;
    box-shadow: 0 4px 16px rgba(0,0,0,.25); z-index: 1000; display: none; max-width: 86%; text-align: center; }
  body.night #msg { background: rgba(35,38,45,.95); color: #eee; }
</style>
</head>
<body>
<div id="map"></div>
<div id="msg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function () {
  if (!window.L) {
    var m0 = document.getElementById('msg');
    m0.innerHTML = 'La carte ne peut pas se charger ici.<br>Ouvre cette page dans Safari, depuis un lien https (hébergé).';
    m0.style.display = 'block'; m0.style.borderRadius = '16px';
    return;
  }
  var rad = Math.PI / 180;
  var map = L.map('map', { zoomControl: false, attributionControl: true }).setView([46.6, 2.4], 6);

  var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  var tileErrs = 0;
  [osm].forEach(function (t) {
    t.on('tileerror', function () {
      tileErrs++;
      if (tileErrs === 6) note('Les images de la carte ne se chargent pas : vérifie ta connexion ou ouvre la page dans Safari.');
    });
    t.on('tileload', function () { tileErrs = -9999; });
  });

  var isNight = null;
  function setNight(n) {
    if (n === isNight) return;
    isNight = n;
    document.body.classList.toggle('night', n);
  }

  // Jour ou nuit selon le soleil à l’endroit où tu es
  function isDark(lat, lng, date) {
    var J = date.getTime() / 86400000 + 2440587.5;
    var n = Math.round(J - 2451545.0 + lng / 360);
    var Js = n - lng / 360;
    var M = (357.5291 + 0.98560028 * Js) % 360;
    var C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
    var lam = (M + C + 180 + 102.9372) % 360;
    var Jt = 2451545.0 + Js + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * lam * rad);
    var sinD = Math.sin(lam * rad) * Math.sin(23.4397 * rad);
    var cosD = Math.cos(Math.asin(sinD));
    var cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sinD) / (Math.cos(lat * rad) * cosD);
    if (cosW > 1) return true;   // nuit polaire
    if (cosW < -1) return false; // jour polaire
    var halfDay = Math.acos(cosW) / (2 * Math.PI); // en jours
    return Math.abs(J - Jt) > halfDay;
  }

  // Avant d’avoir ta position : on se base sur l’heure de l’appareil
  var h = new Date().getHours();
  setNight(h < 7 || h >= 20);

  var last = null;
  function refreshTheme() { if (last) setNight(isDark(last.lat, last.lng, new Date())); }
  setInterval(refreshTheme, 60000);

  var icon = L.divIcon({ className: '', html: '<div class="me"><div class="pulse"></div><div class="dot"></div></div>', iconSize: [22, 22], iconAnchor: [11, 11] });
  var marker = null, circle = null, follow = true, first = true;

  map.on('dragstart', function () { follow = false; });

  function msg(t) {
    var m = document.getElementById('msg');
    if (!t) { m.style.display = 'none'; return; }
    m.textContent = t; m.style.display = 'block';
  }

  function onPos(p) {
    msg('');
    var ll = [p.coords.latitude, p.coords.longitude];
    last = { lat: ll[0], lng: ll[1] };
    refreshTheme();
    if (!marker) {
      circle = L.circle(ll, { radius: p.coords.accuracy, weight: 1, color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: .12, interactive: false }).addTo(map);
      marker = L.marker(ll, { icon: icon, zIndexOffset: 1000 }).addTo(map);
      marker.on('click', function () { follow = true; map.flyTo(marker.getLatLng(), Math.max(map.getZoom(), 17)); });
    } else {
      marker.setLatLng(ll); circle.setLatLng(ll); circle.setRadius(p.coords.accuracy);
    }
    if (first) { first = false; map.setView(ll, 17); }
    else if (follow) { map.panTo(ll, { animate: true }); }
  }

  var fallbackDone = false;
  function fallback() {
    // Sans localisation : on affiche quand même la carte, centrée grâce à l’IP (approximatif)
    if (fallbackDone || marker) return;
    fallbackDone = true;
    fetch('https://ipwho.is/').then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.success !== false && typeof d.latitude === 'number' && !marker) {
        last = { lat: d.latitude, lng: d.longitude };
        refreshTheme();
        map.setView([d.latitude, d.longitude], 11);
      }
    }).catch(function () {});
  }

  var hideT = null;
  function note(t) {
    msg(t);
    clearTimeout(hideT);
    hideT = setTimeout(function () { msg(''); }, 6000);
  }

  function onErr(e) {
    fallback();
    if (e.code === 1) note('Localisation désactivée : active-la pour voir ta position.');
    else if (!marker) note('Position introuvable pour le moment…');
  }

  if (!navigator.geolocation) { fallback(); note('La localisation n’est pas disponible ici.'); }
  else {
    try {
      navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
    } catch (err) { fallback(); }
    // Si la demande reste sans réponse, on montre quand même une carte centrée
    setTimeout(function () { if (!marker) fallback(); }, 4000);
  }
})();
</script>
</body>
</html>
